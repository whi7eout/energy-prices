name: Update US gasoline prices

on:
  schedule:
    # 水曜 16:00 JST (07:00 UTC)。EIA の週次公表（月曜・米東部時間）の後。
    - cron: "0 7 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install xlrd

      - name: Fetch and convert
        run: python scripts/fetch_us_gasoline_prices.py us-gasoline-prices.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- us-gasoline-prices.json; then
            echo "No changes."
          else
            git add us-gasoline-prices.json
            git commit -m "Update US gasoline prices"
            git push
          fi
